- title: "fastLP"
  section: tools
  weight: 1
  eyebrow: "Python + Rust"
  metric: "17x"
  metric_label: "faster than reghdfe"
  summary: "Fast panel local projections for applied macroeconomists, with a beginner-friendly Python API and a high-performance Rust core."
  detail: "Caches and reuses the same calculations across horizons whenever possible instead of rebuilding the same matrix for each horizon."
  snippet: "pip install fastlp-py"
  tags:
    - Econometrics
    - Empirical macro
    - Jorda (2005)
  links:
    - label: Documentation
      url: /fastLP/
    - label: View on GitHub
      url: https://github.com/RitwizSarma/fastLP
      primary: true

- title: "longview"
  section: tools
  weight: 2
  eyebrow: "Stata"
  summary: "A Stata command for plotting cumulative treatment effects from difference-in-difference event-study designs."
  detail: "Aggregate multiple estimates across time; useful when the research question focuses on long-run consequences of a policy or intervention."
  snippet: "net install longview, from(\"https://raw.githubusercontent.com/ritwizsarma/longview-stata/main/\")"
  tags:
    - Diff-in-diff
    - Data viz
  links:
